# ---------------------------------------------------------------------------
# Nginx in front of the Next.js container.
#
# Cloudflare terminates TLS at the edge; this server terminates it again for
# the origin so the hop between Cloudflare and the server is not plaintext
# (Cloudflare "Full (strict)").
# ---------------------------------------------------------------------------

# Rate-limit zones. These protect the origin even if a request bypasses
# Cloudflare — the application's own limiter is the last line, not the first.
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=forms:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;

upstream kianbehsaz_app {
    server app:3000;
    keepalive 32;
}

# Cloudflare sends the visitor's address in CF-Connecting-IP. Trusting it
# blindly would let anyone spoof their IP, so only Cloudflare's ranges are
# accepted as proxies. Refresh from https://www.cloudflare.com/ips/
# (abbreviated here; keep the full list in sync).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name kianbehsaz.com www.kianbehsaz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kianbehsaz.com$request_uri;
    }
}

# Canonicalise on the apex domain: one hostname, one set of URLs, no duplicate
# content for search engines to reconcile.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kianbehsaz.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    return 301 https://kianbehsaz.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kianbehsaz.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Uploads are large; everything else is not.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml;

    # Security headers are set by the application (next.config.ts). They are
    # not repeated here so there is exactly one place to change them.

    limit_req zone=general burst=60 nodelay;

    # ----------------------------------------------------------- static assets
    # Immutable build output: hashed filenames, so cache them hard.
    location /_next/static/ {
        proxy_pass http://kianbehsaz_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Uploaded media, served straight from the shared volume.
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri @app;
    }

    # ------------------------------------------------------------------ forms
    location = /api/contact {
        limit_req zone=forms burst=5 nodelay;
        proxy_pass http://kianbehsaz_app;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/newsletter {
        limit_req zone=forms burst=5 nodelay;
        proxy_pass http://kianbehsaz_app;
        include /etc/nginx/proxy_params.conf;
    }

    # ------------------------------------------------------------- CMS admin
    # The admin panel is never cached and is rate limited separately. Restrict
    # it to the office network by uncommenting the allow/deny block.
    location /admin {
        # allow 203.0.113.0/24;
        # deny all;
        limit_req zone=admin burst=20 nodelay;
        proxy_pass http://kianbehsaz_app;
        include /etc/nginx/proxy_params.conf;
        proxy_buffering off;
    }

    # ------------------------------------------------------------ everything
    location / {
        proxy_pass http://kianbehsaz_app;
        include /etc/nginx/proxy_params.conf;
    }

    location @app {
        proxy_pass http://kianbehsaz_app;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/health {
        proxy_pass http://kianbehsaz_app;
        include /etc/nginx/proxy_params.conf;
        access_log off;
    }
}
